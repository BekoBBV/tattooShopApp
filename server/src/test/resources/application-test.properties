# Tests use their own database on the same cluster, so real data is never touched
spring.mongodb.database=tattoo_studio_test
app.admin.password=test-admin-password
# Many tests book over HTTP from the same address: the per-visitor booking limit has its own test
app.limits.bookings-per-hour=100000
# No demo artist logins in the test database (tests create their own "test-..." logins)
app.demo.artist-password=
