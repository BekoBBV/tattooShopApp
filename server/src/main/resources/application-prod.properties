# Production profile: start with SPRING_PROFILES_ACTIVE=prod (or --spring.profiles.active=prod).
# Settings come from environment variables instead of secrets.properties, for example:
#   MONGODB_URI            mongodb+srv://USER:PASSWORD@CLUSTER.mongodb.net/tattoo_studio?retryWrites=true&w=majority
#   APP_JWT_SECRET         random text, 32+ characters (required: the server refuses to start without it)
#   APP_ADMIN_PASSWORD     password for the "admin" login (needed on the first start)
#   APP_SHOP_WEBSITE_URL   the public address, used in email links
#   SPRING_MAIL_HOST / SPRING_MAIL_PORT / SPRING_MAIL_USERNAME / SPRING_MAIL_PASSWORD   (optional)

# No API docs in production
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Demo logins are for the local demo only, even if secrets.properties sets a demo password
app.demo.artist-password=

# A real token secret is required (no random fallback)
app.jwt.require-secret=true
