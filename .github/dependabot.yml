# Dependabot checks the libraries every week and opens a pull request when one has a fix or a
# security update; CI then runs all the tests on it before anything is merged.
version: 2
updates:
  - package-ecosystem: npm
    directory: /client
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Small updates come together in one pull request instead of one each
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: maven
    directory: /server
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
